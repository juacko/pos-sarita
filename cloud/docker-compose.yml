services:
  postgres:
    image: postgres:16-alpine
    container_name: pos-sarita-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos_sarita
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cambiar_esta_clave}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_user -d pos_sarita"]
      interval: 10s
      timeout: 5s
      retries: 5

  sync-api:
    build: .
    container_name: pos-sarita-sync
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    ports:
      - "4000:4000"

volumes:
  pgdata:
    driver: local

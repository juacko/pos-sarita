<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barra - POS Sarita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/modal-utils.js"></script>
  <style>
    .barra-layout {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 18px;
      padding: 24px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .comanda-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      border: 1px solid var(--border);
      border-top: 5px solid #4F46E5;
      transition: all 0.2s var(--ease-out);
    }

    .comanda-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .comanda-card.urgente {
      border-top-color: var(--danger);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: var(--shadow-sm); }
      50% { box-shadow: 0 4px 20px rgba(239, 68, 68, 0.35); }
    }

    .comanda-header {
      padding: 14px 18px;
      background: var(--bg-main);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .comanda-mesa {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-dark);
    }

    .comanda-time {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .comanda-body {
      padding: 16px 18px;
    }

    .comanda-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .comanda-item:last-child {
      border-bottom: none;
    }

    .comanda-item-qty {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.15rem;
      background: #EEF2FF;
      color: #4F46E5;
      padding: 2px 10px;
      border-radius: var(--radius-sm);
      margin-right: 12px;
      min-width: 36px;
      text-align: center;
    }

    .comanda-item-info {
      flex: 1;
    }

    .comanda-item-name {
      font-weight: 600;
      color: var(--text-dark);
      font-size: 0.95rem;
    }

    .comanda-item-nota {
      font-size: 0.78rem;
      color: var(--warning-text);
      font-weight: 600;
      font-style: italic;
    }

    .comanda-item-status {
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-weight: 700;
    }

    .comanda-item-nuevo {
      background: #DBEAFE;
      border: 1.5px solid #2563EB;
      border-radius: var(--radius-full);
      padding: 2px 10px;
      font-size: 0.68rem;
      font-weight: 800;
      color: #1D4ED8;
      text-transform: uppercase;
      animation: pulseNuevo 1.5s infinite;
    }

    @keyframes pulseNuevo {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    .comanda-item-check {
      width: 20px;
      height: 20px;
      accent-color: #4F46E5;
      cursor: pointer;
      flex-shrink: 0;
    }

    .comanda-item.listo {
      opacity: 0.55;
    }

    .comanda-item.listo .comanda-item-name {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .comanda-progreso {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      background: var(--gray-light);
      color: var(--text-dark);
      display: inline-block;
      margin-bottom: 8px;
    }

    .comanda-progreso.completo {
      background: var(--success-light);
      color: var(--success-text);
    }

    .comanda-footer {
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      background: var(--bg-main);
      display: flex;
      gap: 10px;
    }

    .barra-header {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text-dark);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .barra-header h1 {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-dark);
    }

    .comanda-nota {
      background: #FEF3C7;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      margin: 8px 0;
      color: #92400E;
    }

    .comanda-tipo {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .comanda-tipo.delivery { background: #DBEAFE; color: #1D4ED8; }
    .comanda-tipo.llevar { background: #FEF3C7; color: #92400E; }
    .comanda-tipo.salon { background: #D1FAE5; color: #065F46; }

    .comanda-cliente {
      font-size: 0.78rem;
      color: #374151;
      margin-top: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--gray);
    }

    .empty-state h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="barra-header">
    <h1>🍹 BARRA - Pedidos en vivo</h1>
    <div>
      <span id="pedidosCount" style="margin-right:16px;">0 pedidos</span>
      <button class="btn btn-warning btn-sm" onclick="openStockModal()" style="font-weight:700; margin-right:6px; background:#FEF3C7; color:#92400E; border:1px solid #FDE68A;">📦 Avisar Stock</button>
      <button class="btn btn-secondary btn-sm" onclick="openHistorial()">🕓 Historial</button>
      <span id="reloj" style="margin-left:16px;"></span>
    </div>
  </div>

  <!-- MODAL AVISO DE STOCK BARRA -->
  <div class="modal-overlay" id="stockBarraModal" onclick="if(event.target===this)closeStockModal()">
    <div class="modal" style="max-width:680px; width:95%;">
      <div class="modal-header">
        <h2>📦 Avisar Stock de Bebidas / Barra a Meseros</h2>
        <button class="modal-close" onclick="closeStockModal()">&times;</button>
      </div>
      <div class="modal-body" style="max-height:65vh; overflow-y:auto; padding:16px;">
        <input type="text" id="stockBarraSearch" placeholder="🔍 Buscar bebida o producto..." oninput="renderStockBarraList()" style="width:100%; padding:10px 14px; border:1px solid #CBD5E1; border-radius:8px; margin-bottom:12px; font-size:0.95rem;">
        <div id="stockBarraList" style="display:flex; flex-direction:column; gap:8px;">
          <p style="text-align:center; color:#64748B;">Cargando productos...</p>
        </div>
      </div>
      <div class="modal-footer" style="display:flex; justify-content:space-between;">
        <span style="font-size:0.85rem; color:#64748B;">Alerta en vivo a todos los meseros</span>
        <button class="btn btn-primary" onclick="closeStockModal()">✓ Listo</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="historialModal" onclick="if(event.target===this)closeHistorial()">
    <div class="modal" style="max-width:760px;">
      <div class="modal-header">
        <h2>🕓 Historial de pedidos de barra</h2>
        <button class="modal-close" onclick="closeHistorial()">&times;</button>
      </div>
      <div class="modal-body" id="historialBody" style="max-height:70vh;overflow-y:auto;"></div>
    </div>
  </div>

  <div id="comandasContainer" class="barra-layout">
    <div class="empty-state">
      <h2>🎯 Sin pedidos pendientes</h2>
      <p>Los pedidos nuevos de barra aparecerán aquí automáticamente</p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/barra-app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurar Impresoras - POS Sarita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .config-container {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 24px;
    }
    .config-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      margin-bottom: 24px;
      overflow: hidden;
    }
    .config-card-header {
      padding: 16px 20px;
      font-weight: 700;
      font-size: 1.1rem;
      border-bottom: 1px solid #E5E7EB;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .config-card-body {
      padding: 20px;
    }
    .printer-selector {
      width: 100%;
      padding: 12px;
      border: 2px solid #D1D5DB;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 12px;
    }
    .printer-selector:focus {
      border-color: var(--blue);
      outline: none;
    }
    .printer-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }
    .printer-status.ok {
      background: #D1FAE5;
      color: #065F46;
    }
    .printer-status.err {
      background: #FEE2E2;
      color: #991B1B;
    }
    .printer-status.waiting {
      background: #FEF3C7;
      color: #92400E;
    }
    .badge-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: bold;
    }
    .printer-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 6px;
    }
    .printer-option-info {
      flex: 1;
    }
    .printer-option-name {
      font-weight: 600;
    }
    .printer-option-detail {
      font-size: 0.75rem;
      color: var(--gray);
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .test-result {
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .test-result.success { background: #D1FAE5; color: #065F46; }
    .test-result.error { background: #FEE2E2; color: #991B1B; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🖨️ Configurar Impresoras</h1>
    <div>
      <a href="/" class="btn btn-outline btn-sm">← Volver al POS</a>
    </div>
  </div>

  <div class="config-container">
    <div id="loadingMsg" style="text-align:center;padding:40px;color:var(--gray);">
      Detectando impresoras disponibles...
    </div>

    <!-- IMPRESORA CAJA -->
    <div class="config-card" id="cardCaja" style="display:none;">
      <div class="config-card-header">
        <span>🧾 Impresora de Caja (Ticket)</span>
        <span class="badge badge-blue">58mm</span>
      </div>
      <div class="config-card-body">
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:4px;">
          Seleccionar impresora para tickets
        </label>
        <select id="selectCaja" class="printer-selector"></select>
        <div id="statusCaja" class="printer-status waiting">⚙️ Sin probar</div>
        <div class="btn-group">
          <button class="btn btn-primary btn-sm" onclick="testPrinter('caja')">🖨️ Probar impresión</button>
          <button class="btn btn-success btn-sm" onclick="guardarConfig()">💾 Guardar configuración</button>
        </div>
        <div id="testResultCaja"></div>
      </div>
    </div>

    <!-- IMPRESORA COCINA -->
    <div class="config-card" id="cardCocina" style="display:none;">
      <div class="config-card-header">
        <span>👨‍🍳 Impresora de Cocina (Comanda)</span>
        <span class="badge badge-yellow">80mm</span>
      </div>
      <div class="config-card-body">
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:4px;">
          Seleccionar impresora para comandas de cocina
        </label>
        <select id="selectCocina" class="printer-selector"></select>
        <div id="statusCocina" class="printer-status waiting">⚙️ Sin probar</div>
        <div class="btn-group">
          <button class="btn btn-primary btn-sm" onclick="testPrinter('cocina')">🖨️ Probar impresión</button>
          <button class="btn btn-success btn-sm" onclick="guardarConfig()">💾 Guardar configuración</button>
        </div>
        <div id="testResultCocina"></div>
      </div>
    </div>

    <!-- IMPRESORA BARRA -->
    <div class="config-card" id="cardBarra" style="display:none;">
      <div class="config-card-header">
        <span>🍹 Impresora de Barra (Bebidas/Cócteles)</span>
        <span class="badge badge-blue">80mm</span>
      </div>
      <div class="config-card-body">
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:4px;">
          Seleccionar impresora para comandas de barra
        </label>
        <select id="selectBarra" class="printer-selector"></select>
        <div id="statusBarra" class="printer-status waiting">⚙️ Sin probar</div>
        <div class="btn-group">
          <button class="btn btn-primary btn-sm" onclick="testPrinter('barra')">🖨️ Probar impresión</button>
          <button class="btn btn-success btn-sm" onclick="guardarConfig()">💾 Guardar configuración</button>
        </div>
        <div id="testResultBarra"></div>
      </div>
    </div>

    <div style="text-align:center;margin-top:16px;">
      <button class="btn btn-outline" onclick="detectarImpresoras()">🔄 Refrescar impresoras</button>
    </div>
  </div>

  <script src="/js/impresoras-app.js"></script>
</body>
</html>
